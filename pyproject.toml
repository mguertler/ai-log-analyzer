[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-log-analyzer"
version = "0.3.9"
description = "Lightweight AI-assisted analyzer for Linux logs from stdin or files"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.10"
dependencies = [
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
ai-log-analyzer = "ai_log_analyzer:main"

[tool.hatch.build.targets.wheel]
only-include = []

[tool.hatch.build.targets.wheel.force-include]
"src/ai_log_analyzer" = "ai_log_analyzer.py"

[tool.hatch.build.targets.sdist]
include = [
    "README.md",
    "Makefile",
    "pyproject.toml",
    "ai-log-analyzer.conf.example",
    "src/ai_log_analyzer",
    "scripts/install-simple.sh",
    "tests/",
]

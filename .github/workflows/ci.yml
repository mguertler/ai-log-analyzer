name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest platformdirs
      - name: Syntax checks
        run: |
          python -m py_compile src/ai_log_analyzer
          python src/ai_log_analyzer --version
          python src/ai_log_analyzer --help > /dev/null
          bash -n scripts/install-simple.sh
      - name: Run tests
        run: python -m pytest -q tests
      - name: Build package
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl
          ai-log-analyzer --version
